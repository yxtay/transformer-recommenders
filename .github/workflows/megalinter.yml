name: megalinter
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
permissions: {}
jobs:
  megalinter:
    permissions:
      contents: write
      pull-requests: write
      security-events: write
      statuses: write
    uses: yxtay/.github/.github/workflows/megalinter.yml@83cc447776109d6d9683ac510219d7440c0c8d03 # main
    with:
      run-ci_light: false
      run-python: true
