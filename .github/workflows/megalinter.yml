name: megalinter
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
permissions: {}
jobs:
  megalinter:
    permissions:
      contents: write
      pull-requests: write
      security-events: write
      statuses: write
    uses: yxtay/.github/.github/workflows/megalinter.yml@30e79d27ff7ebd1419ff35768d78d956bc67a1f4 # main
    with:
      run-ci_light: false
      run-python: true
